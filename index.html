<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockman GO Asset Search</title>
    <style>
        /* General Body & Theme */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #e1e1e1;
            margin: 0;
            padding: 20px;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: auto;
            text-align: center;
        }

        h1 {
            color: #ffffff;
            font-weight: 600;
        }

        /* Search Bar */
        #search-input {
            width: 90%;
            max-width: 600px;
            padding: 12px 15px;
            margin-bottom: 30px;
            font-size: 1.1em;
            border: 1px solid #444;
            border-radius: 8px;
            background-color: #2c2c2c;
            color: #e1e1e1;
            transition: all 0.2s ease-in-out;
        }

        #search-input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
        }

        /* Results Grid */
        #results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        /* Individual Block Card */
        .block-card {
            background-color: #2c2c2c;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #3a3a3a;
            transition: transform 0.2s ease;
            cursor: pointer; /* Indicates it's clickable */
        }
        
        .block-card:hover {
            transform: translateY(-5px);
            border-color: #555;
        }

        .block-card img {
            width: 64px;
            height: 64px;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        .block-card p {
            margin-top: 10px;
            font-size: 0.8em;
            color: #b0b0b0;
            word-break: break-all;
        }
        
        /* Message for loading or no results */
        #message {
            font-style: italic;
            color: #888;
        }
        
        /* --- MODAL (POPUP) STYLES --- */
        #modal-overlay {
            display: none; /* Hidden by default */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: #333;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
            max-width: 90%;
            text-align: center;
            position: relative;
        }
        
        .close-button {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-button:hover {
            color: #fff;
        }
        
        #modal-image {
            width: 128px;
            height: 128px;
            image-rendering: pixelated;
            margin-bottom: 15px;
            background-color: #555;
            border-radius: 5px;
        }

        #modal-title {
            margin-top: 0;
            margin-bottom: 25px;
            color: #fff;
            font-size: 1.4em;
        }

        #download-button {
            display: inline-block;
            padding: 10px 25px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        
        #download-button:hover {
            background-color: #0056b3;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Blockman GO Asset Search</h1>
        <p>Search by filename, name, or tags (e.g., "door", "wood", "redstone", "crop").</p>
        <input type="search" id="search-input" placeholder="Loading assets...">
        <div id="results-grid">
            <p id="message">Loading...</p>
        </div>
    </div>

    <!-- The Modal (Popup) Structure -->
    <div id="modal-overlay">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2 id="modal-title">Block Name</h2>
            <img id="modal-image" src="" alt="Block Image">
            <a id="download-button" href="#" download>Download</a>
        </div>
    </div>

    <script>
        const ASSET_URL = "https://cdn.jsdelivr.net/gh/itzst6v6/mineasset@blockman/block_structure.json";

        // Main page elements
        const searchInput = document.getElementById('search-input');
        const resultsGrid = document.getElementById('results-grid');
        const messageEl = document.getElementById('message');
        
        // Modal elements
        const modalOverlay = document.getElementById('modal-overlay');
        const modalTitle = document.getElementById('modal-title');
        const modalImage = document.getElementById('modal-image');
        const downloadButton = document.getElementById('download-button');
        const closeButton = document.querySelector('.close-button');

        let allBlocks = {};

        function renderBlocks(blocksToRender) {
            resultsGrid.innerHTML = '';
            const blockKeys = Object.keys(blocksToRender);
            
            if (blockKeys.length === 0) {
                messageEl.textContent = 'No results found.';
                resultsGrid.appendChild(messageEl);
                return;
            }

            for (const filename of blockKeys) {
                const block = blocksToRender[filename];
                const card = document.createElement('div');
                card.className = 'block-card';
                // Store the filename on the card itself for easy access later
                card.dataset.filename = filename; 
                
                card.innerHTML = `
                    <img src="${block.textureUrl}" alt="${block.name}">
                    <p>${filename}</p> <!-- Displaying filename for clarity -->
                `;
                resultsGrid.appendChild(card);
            }
        }

        async function fetchAssets() {
            try {
                const response = await fetch(ASSET_URL);
                if (!response.ok) throw new Error(`Network error: ${response.statusText}`);
                const data = await response.json();
                
                allBlocks = data.blocks;
                renderBlocks(allBlocks);
                
                searchInput.placeholder = "Search assets...";
                messageEl.style.display = 'none';
            } catch (error) {
                console.error("Failed to fetch assets:", error);
                messageEl.textContent = 'Error: Could not load asset library.';
                searchInput.placeholder = "Error loading assets";
                searchInput.disabled = true;
            }
        }

        function handleSearch() {
            const searchTerm = searchInput.value.toLowerCase().trim();
            if (!searchTerm) {
                renderBlocks(allBlocks);
                return;
            }
            const filteredBlocks = Object.fromEntries(
                Object.entries(allBlocks).filter(([filename, block]) => {
                    const nameMatch = block.name.toLowerCase().includes(searchTerm);
                    const filenameMatch = filename.toLowerCase().includes(searchTerm);
                    const tagMatch = block.tags.some(tag => tag.toLowerCase().includes(searchTerm));
                    return nameMatch || filenameMatch || tagMatch;
                })
            );
            renderBlocks(filteredBlocks);
        }
        
        // --- MODAL FUNCTIONS ---
        function openModal(filename) {
            const block = allBlocks[filename];
            if (!block) return; // Safety check

            // Populate the modal with the block's data
            modalTitle.textContent = block.name;
            modalImage.src = block.textureUrl;
            downloadButton.href = block.textureUrl;
            // This sets the default filename when the user clicks download
            downloadButton.setAttribute('download', filename);

            // Show the modal
            modalOverlay.style.display = 'flex';
        }

        function closeModal() {
            modalOverlay.style.display = 'none';
        }

        // --- EVENT LISTENERS ---
        searchInput.addEventListener('input', handleSearch);

        // Listen for clicks on the entire grid (event delegation)
        resultsGrid.addEventListener('click', (event) => {
            // Find the closest parent element that is a .block-card
            const card = event.target.closest('.block-card');
            if (card) {
                const filename = card.dataset.filename;
                openModal(filename);
            }
        });
        
        // Listen for clicks to close the modal
        closeButton.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (event) => {
            // If the user clicks on the dark overlay itself (not the content box), close it
            if (event.target === modalOverlay) {
                closeModal();
            }
        });

        // Start everything
        fetchAssets();
    </script>

</body>
</html>
