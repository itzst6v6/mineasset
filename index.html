<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mineasset</title>
    
    <!-- Lenis Smooth Scroll Library -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    
    <!-- Google Fonts: Poppins & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- THEME & VARIABLES --- */
        :root {
            --bg-color: #212121;
            --surface-color: #2E2E2E;
            --surface-hover: #3c3c3c;
            --border-color: #444446;
            --text-color: #f2f2f7;
            --text-muted-color: #8e8e93;
            --accent-color: #34D399; /* Vibrant Green */
            --accent-hover: #2cb580;
            /* New Font Family Variable */
            --font-family: 'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* --- BASE & ANIMATIONS --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        html.lenis { height: auto; }
        .lenis.lenis-smooth { scroll-behavior: auto !important; }
        .lenis.lenis-stopped { overflow: hidden; }

        body {
            /* Using the new font variable */
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 20px 60px 20px;
        }
        .container {
            max-width: 1200px;
            margin: auto;
            text-align: center;
        }
        
        /* --- HEADER & LOGO --- */
        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            margin-bottom: 30px;
            animation: fadeIn 0.5s ease-out both;
        }
        .header img {
            width: 50px;
            height: 50px;
        }
        h1 {
            font-size: 2.8em;
            font-weight: 700;
            color: var(--text-color);
            margin: 0;
        }
        
        /* --- SEARCH --- */
        .search-wrapper {
            position: relative;
            max-width: 600px;
            margin: 0 auto;
            animation: fadeIn 0.5s 0.2s ease-out both;
        }
        .search-icon {
            position: absolute; left: 18px; top: 50%;
            transform: translateY(-50%);
            width: 20px; height: 20px;
            fill: var(--text-muted-color);
            pointer-events: none;
        }
        #search-input {
            width: 100%;
            padding: 14px 20px 14px 50px;
            font-size: 1.1em;
            font-family: var(--font-family); /* Ensure input uses the font */
            border: none;
            border-radius: 12px;
            background-color: var(--surface-color);
            color: var(--text-color);
            transition: all 0.2s ease-in-out;
            box-sizing: border-box;
        }
        #search-input:focus {
            outline: none;
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-color) 25%, transparent);
        }
        .info-bar {
            margin: 15px 0 35px 0;
            font-size: 0.9em;
            animation: fadeIn 0.5s 0.3s ease-out both;
        }
        #view-json-link {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
        }
        #view-json-link:hover { text-decoration: underline; }
        
        /* --- TABS --- */
        .tab-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            animation: fadeIn 0.5s 0.1s ease-out both;
        }
        .tab-button {
            padding: 10px 25px;
            font-size: 1em;
            font-family: var(--font-family); /* Ensure buttons use the font */
            font-weight: 600;
            border: none;
            background-color: var(--surface-color);
            color: var(--text-muted-color);
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-button:hover {
            background-color: var(--surface-hover);
            color: var(--text-color);
        }
        .tab-button.active {
            background-color: var(--accent-color);
            color: #111;
            cursor: default;
        }
        .tab-button.active:hover { background-color: var(--accent-hover); }

        /* --- GRID & CARDS --- */
        #results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 20px;
            min-height: 200px;
            position: relative;
        }
        .block-card {
            background-color: var(--surface-color);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            transition: background-color 0.2s ease;
            cursor: pointer;
            /* Card entrance animation */
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
        }
        .block-card:hover { background-color: var(--surface-hover); }
        .block-card img {
            width: 64px; height: 64px;
            image-rendering: pixelated;
        }
        .block-card p {
            margin-top: 15px;
            font-size: 0.85em;
            color: var(--text-muted-color);
            word-break: break-word;
            text-align: center;
            line-height: 1.3;
        }
        #message {
            grid-column: 1 / -1;
            font-style: italic;
            color: var(--text-muted-color);
            padding: 40px 0;
        }

        /* --- LOADER --- */
        .loader {
            position: absolute; left: 50%; top: 50px;
            transform: translateX(-50%);
            width: 50px; height: 50px;
            border: 5px solid var(--surface-hover);
            border-bottom-color: var(--accent-color);
            border-radius: 50%;
            display: none;
            animation: rotation 1s linear infinite;
        }
        .loader.visible { display: inline-block; }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* --- MODAL --- */
        #modal-overlay {
            display: none; position: fixed;
            z-index: 1000; left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            align-items: center; justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #modal-overlay.visible { display: flex; opacity: 1; }
        .modal-content {
            background-color: var(--surface-color);
            padding: 30px; border-radius: 16px;
            width: 320px; max-width: 90%;
            text-align: center; position: relative;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }
        #modal-overlay.visible .modal-content { transform: scale(1); }
        .close-button {
            position: absolute; top: 10px; right: 15px;
            color: var(--text-muted-color);
            font-size: 28px; font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
        }
        .close-button:hover { color: var(--text-color); }
        #modal-image {
            width: 128px; height: 128px;
            image-rendering: pixelated;
            margin-bottom: 15px;
            background-color: var(--bg-color);
            border-radius: 8px;
        }
        #modal-title {
            margin-top: 0; margin-bottom: 25px;
            color: var(--text-color);
            font-size: 1.5em; font-weight: 600;
        }
        #download-button {
            display: inline-block; padding: 12px 30px;
            background-color: var(--accent-color);
            color: #111; text-decoration: none;
            border-radius: 8px; font-weight: bold;
            font-family: var(--font-family); /* Ensure buttons use the font */
            transition: background-color 0.2s;
            cursor: pointer; border: none; font-size: 1em;
        }
        #download-button:hover { background-color: var(--accent-hover); }
        #download-button.is-loading {
            background-color: var(--surface-hover);
            cursor: not-allowed;
        }

        /* --- MOBILE RESPONSIVENESS --- */
        @media (max-width: 600px) {
            body {
                padding: 15px 15px 40px 15px;
            }
            .header img {
                width: 40px;
                height: 40px;
            }
            h1 {
                font-size: 2.2em;
            }
            .tab-button {
                padding: 8px 20px;
            }
            #results-grid {
                grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <img src="https://images.icon-icons.com/2699/PNG/512/minecraft_logo_icon_168974.png" alt="Minecraft Logo">
            <h1>Mineasset</h1>
        </div>

        <div class="tab-container" id="tab-container"></div>

        <div class="search-wrapper">
             <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"/></svg>
            <input type="search" id="search-input" placeholder="Select a library to search...">
        </div>
        <div class="info-bar">
            <a id="view-json-link" href="#" target="_blank" rel="noopener noreferrer">View Source JSON</a>
        </div>
        
        <div id="results-grid">
            <div id="loader" class="loader"></div>
            <p id="message">Please select a library above.</p>
        </div>
    </div>

    <div id="modal-overlay">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2 id="modal-title">Block Name</h2>
            <img id="modal-image" src="" alt="Block Image">
            <button id="download-button">Download</button>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const SOURCES = {
            'bmg': { name: 'Blockman GO', url: 'https://cdn.jsdelivr.net/gh/itzst6v6/mineasset@blockman/block_structure.json' },
            'mc': { name: 'Minecraft', url: 'https://cdn.jsdelivr.net/gh/itzst6v6/mineasset@minecraft/block_structure.json' }
        };

        // --- GLOBAL STATE & ELEMENTS ---
        let activeSourceId = null;
        const assetCache = {};
        const tabContainer = document.getElementById('tab-container');
        const searchInput = document.getElementById('search-input');
        const resultsGrid = document.getElementById('results-grid');
        const messageEl = document.getElementById('message');
        const loaderEl = document.getElementById('loader');
        const viewJsonLink = document.getElementById('view-json-link');
        const modalOverlay = document.getElementById('modal-overlay');
        const modalTitle = document.getElementById('modal-title');
        const modalImage = document.getElementById('modal-image');
        const downloadButton = document.getElementById('download-button');
        const closeButton = document.querySelector('.close-button');

        // --- FUNCTIONS ---
        function renderBlocks(blocksToRender) {
            resultsGrid.innerHTML = '';
            const blockKeys = Object.keys(blocksToRender); 
            
            if (blockKeys.length === 0) {
                messageEl.textContent = 'No results found.';
                resultsGrid.appendChild(messageEl);
                return;
            }
            
            let delay = 0;
            for (const filename of blockKeys) {
                const block = blocksToRender[filename];
                const card = document.createElement('div');
                card.className = 'block-card';
                card.dataset.filename = filename;
                card.style.animationDelay = `${delay}s`;
                
                card.innerHTML = `
                    <img src="${block.textureUrl}" alt="${block.name}" loading="lazy">
                    <p>${block.name}</p>
                `;
                resultsGrid.appendChild(card);
                if (delay < 0.5) delay += 0.02;
            }
        }

        async function fetchAssets(sourceId) {
            resultsGrid.innerHTML = '';
            loaderEl.classList.add('visible');
            resultsGrid.appendChild(loaderEl);
            messageEl.textContent = '';
            searchInput.disabled = true;

            if (assetCache[sourceId]) {
                renderBlocks(assetCache[sourceId].blocks);
                loaderEl.classList.remove('visible');
                searchInput.disabled = false;
                return;
            }

            try {
                const response = await fetch(SOURCES[sourceId].url);
                if (!response.ok) throw new Error(`Network error: ${response.statusText}`);
                const data = await response.json();
                
                assetCache[sourceId] = data;
                renderBlocks(data.blocks);
                searchInput.placeholder = `Search in ${SOURCES[sourceId].name}...`;
            } catch (error) {
                console.error("Failed to fetch assets:", error);
                messageEl.textContent = `Error: Could not load the ${SOURCES[sourceId].name} library.`;
                resultsGrid.appendChild(messageEl);
                searchInput.placeholder = "Error loading assets";
            } finally {
                loaderEl.classList.remove('visible');
                searchInput.disabled = false;
            }
        }

        function handleSearch() {
            if (!activeSourceId || !assetCache[activeSourceId]) return;
            const currentData = assetCache[activeSourceId].blocks;
            const searchTerm = searchInput.value.toLowerCase().trim();

            if (!searchTerm) {
                renderBlocks(currentData);
                return;
            }

            const filteredBlocks = Object.fromEntries(
                Object.entries(currentData).filter(([filename, block]) => {
                    const nameMatch = block.name.toLowerCase().includes(searchTerm);
                    const filenameMatch = filename.toLowerCase().includes(searchTerm);
                    const tagMatch = block.tags && block.tags.some(tag => tag.toLowerCase().includes(searchTerm));
                    return nameMatch || filenameMatch || tagMatch;
                })
            );
            renderBlocks(filteredBlocks);
        }
        
        function handleTabClick(event) {
            const newSourceId = event.target.dataset.source;
            if (newSourceId === activeSourceId) return;
            activeSourceId = newSourceId;
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            viewJsonLink.href = SOURCES[activeSourceId].url;
            searchInput.value = '';
            fetchAssets(activeSourceId);
        }

        function openModal(filename) {
            const block = assetCache[activeSourceId].blocks[filename];
            if (!block) return;
            modalTitle.textContent = block.name;
            modalImage.src = block.textureUrl;
            downloadButton.dataset.url = block.textureUrl;
            downloadButton.dataset.filename = filename;
            modalOverlay.classList.add('visible');
        }

        function closeModal() {
            modalOverlay.classList.remove('visible');
        }

        async function handleDownloadClick(event) {
            const button = event.currentTarget;
            if (button.classList.contains('is-loading')) return;
            button.classList.add('is-loading');
            button.textContent = 'Downloading...';

            try {
                const response = await fetch(button.dataset.url);
                if (!response.ok) throw new Error('Network response was not ok.');
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const tempLink = document.createElement('a');
                tempLink.href = blobUrl;
                tempLink.setAttribute('download', button.dataset.filename);
                document.body.appendChild(tempLink);
                tempLink.click();
                document.body.removeChild(tempLink);
                window.URL.revokeObjectURL(blobUrl);
            } catch (error) {
                console.error('Download failed:', error);
                alert('Download failed. Please try again.');
            } finally {
                button.classList.remove('is-loading');
                button.textContent = 'Download';
            }
        }

        // --- INITIALIZATION ---
        function init() {
            for (const sourceId in SOURCES) {
                const source = SOURCES[sourceId];
                const button = document.createElement('button');
                button.className = 'tab-button';
                button.textContent = source.name;
                button.dataset.source = sourceId;
                button.addEventListener('click', handleTabClick);
                tabContainer.appendChild(button);
            }

            const minecraftTab = document.querySelector('.tab-button[data-source="mc"]');
            if (minecraftTab) {
                minecraftTab.click();
            } else {
                 messageEl.textContent = 'Please select a library to start.';
            }

            searchInput.addEventListener('input', handleSearch);
            resultsGrid.addEventListener('click', (e) => {
                const card = e.target.closest('.block-card');
                if (card) openModal(card.dataset.filename);
            });
            closeButton.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closeModal();
            });
            downloadButton.addEventListener('click', handleDownloadClick);
        }

        // --- Lenis Smooth Scroll ---
        const lenis = new Lenis();
        function raf(time) {
            lenis.raf(time);
            requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);

        init();
    </script>
</body>
</html>
